# IPC 쪽 설정. 실차 rosbag(bag1512, 264초) 기준으로 토픽·유닛을 맞췄다.
#
# 와치독은 센서 토픽을 구독하지 않는다. 실차에서 구독자가 하나 더 붙으면 라이다 발행 주기가
# 떨어지는 현상이 있어서, 감시 근거를 데이터 경로 바깥의 정보로만 제한한다:
#   1) 토픽에 발행자가 있는가        count_publishers(topic)  ← DDS 디스커버리 정보. 구독 없음
#   2) 드라이버 노드가 그래프에 있는가  get_node_names()         ← node_name 을 채운 센서만
#   3) 드라이버가 /diagnostics 를 내면 그 보고가 정상인가          ← diag_names 를 채운 센서만
# 와치독이 구독하는 것은 /diagnostics 하나뿐이다 (gate_topic 을 켜면 기어 상태 토픽 하나 추가).
#
# 한계: 발행자가 살아 있는데 데이터만 멈추는 고장은 드라이버가 /diagnostics 를 내지 않으면 못 잡는다.
# bag1512 의 /diagnostics 에는 CAN 관련 이름만 있고 rslidar·GPS 드라이버 보고는 없다.
# 그래서 아래 라이다·GPS 는 그래프(1, 2)만 본다. 드라이버에 diagnostic_updater 를 붙이면 diag_names 를 채운다.
#
#   센서 토픽                      타입(참고)                     실측 주기   복구 유닛
#   /front_m1p/rslidar_points     sensor_msgs/msg/PointCloud2    10.03 Hz   lidar.service
#   /rear_m1p/rslidar_points      sensor_msgs/msg/PointCloud2    10.03 Hz   lidar.service
#   /left_bp/rslidar_points       sensor_msgs/msg/PointCloud2    10.03 Hz   lidar.service
#   /right_bp/rslidar_points      sensor_msgs/msg/PointCloud2    10.03 Hz   lidar.service
#   /fix                          sensor_msgs/msg/NavSatFix      20.05 Hz   rtk-gps.service
#
# /**: 는 노드 이름이 뭐든 적용된다는 뜻. (-r __node:=watchdog_ipc 로 띄워도 됨)

/**:
  ros__parameters:
    use_sim_time: false

    # true: 판정과 기록만 하고 행동은 하지 않는다 (감지 전용 모드).
    # README의 "활성화 기준"을 만족하기 전까지 false로 바꾸지 않는다.
    dry_run: true

    # events.csv(상태 변화·행동·복구 시간) 저장 위치. "" 면 끔.
    log_dir: "~/.local/state/sensor_watchdog"
    # events.csv 크기 상한(MB). 넘으면 <파일>.1 백업 하나만 남기고 새로 시작한다. 0 이면 무제한.
    log_max_mb: 20.0

    # ---------------------------------------------------------------- 안전 게이트
    # 기어가 P(파킹)일 때만 복구 행동을 허용한다. 이걸 켜면 기어 상태 토픽(수십 바이트, 50 Hz)을
    # 하나 구독한다. 센서 토픽이 아니라 발행 주기에 영향은 없지만, 테스트 중이라 꺼 둔다("").
    # 상용화 전에 켜려면 "" 를 /vehicle/status/gear_status 로 바꾸면 된다. 아래 설정은 그대로 둔다.
    #   autoware_vehicle_msgs/msg/GearReport = { builtin_interfaces/Time stamp; uint8 report }
    #   report 상수: NEUTRAL=1, DRIVE=2, REVERSE=20, PARK=22, LOW=23
    gate_topic: ""
    gate_type: autoware_vehicle_msgs/msg/GearReport
    gate_prefix: stamp          # none | stamp | header
    gate_field_bytes: 1         # uint8 report
    gate_ok_value: 22           # PARK
    gate_reliable: true         # 발행자가 reliable
    gate_timeout_sec: 1.0       # 50 Hz 토픽. 1초 끊기면 "허용 아님"
    # -1: 항상 게이트를 따른다 (주행 중엔 BLOCKED_GATE 로 기다리고 P단이 되면 재시작).
    # 양수(예: 30): 고장이 그 시간 이상 계속되면 주행 중이라도 재시작한다.
    gate_bypass_after_sec: -1.0

    # ---------------------------------------------------------------- 공통 원인
    # 센서 수가 아니라 복구 단위(systemd 유닛) 수로 센다. 라이다 4대는 lidar.service 하나라서 1개.
    # 현재 복구 단위: lidar.service, rtk-gps.service → 2개. 둘이 3초 안에 같이 죽으면
    # 센서 탓이 아니라 IPC/DDS/네트워크 탓으로 보고 행동하지 않는다.
    # 카메라(cam.service)를 sensors 에 추가하면 3으로 올린다.
    common_cause_min: 2
    common_cause_window_sec: 3.0

    # 한 행동(systemctl/power 스크립트/lifecycle)에 허용하는 최대 시간
    action_timeout_sec: 30.0

    # 서비스 재시작 명령 앞부분. 시스템 유닛이면 ["sudo", "-n", "systemctl"]
    systemctl_cmd: ["systemctl", "--user"]

    # 안전 MCU로 보내는 UDP 하트비트. "" 면 끔.
    heartbeat_host: ""
    heartbeat_port: 5005

    # ---------------------------------------------------------------- 판정 정책
    # 시작/행동 직후 판정 유예. 실차(2026-11-04)에서 lidar.service 재시작 뒤 라이다 4대 발행자가
    # 다시 나타나기까지 23초 걸렸다. 10초였을 때는 유예가 끝나자 NO_PUBLISHER 로 다시 잡혀
    # HOLDING→COOLDOWN 을 거쳤다(쿨다운 덕에 재시작 루프는 안 됐지만 11초간 ERROR 로 보고됨).
    # 실측 + 여유 7초. 드라이버 기동이 더 느린 장비면 더 올린다.
    startup_grace_sec: 30.0
    # 고장이 이만큼 지속돼야 행동한다 (DDS 디스커버리가 잠깐 흔들리는 것을 거른다).
    fault_hold_sec: 2.0

    # 확실한 고장. fault_hold_sec 뒤 재시작.
    #   NODE_NOT_VISIBLE : node_name 이 그래프에서 사라짐 (프로세스 죽음)
    #   NO_PUBLISHER     : 토픽 발행자 0 (프로세스 죽음 또는 아직 안 뜸)
    #   DIAG_STALE       : 드라이버 diag 보고가 diag_timeout_sec 넘게 끊김 (프로세스는 있는데 멈춤)
    act_on_faults: ["NODE_NOT_VISIBLE", "NO_PUBLISHER", "DIAG_STALE"]
    # 드라이버가 스스로 ERROR 라고 보고하는 경우. 주기 검사는 잠깐 튈 수 있어 더 오래 참는다.
    act_on_faults_slow: ["DIAG_ERROR"]
    slow_fault_hold_sec: 5.0
    # 행동 완료 후 다음 행동까지 최소 간격
    cooldown_sec: 30.0
    # 같은 칸을 몇 번 시도하고 다음 칸으로
    attempts_per_step: 2
    # 이만큼 정상이면 사다리를 처음으로 되돌린다
    healthy_reset_sec: 600.0

    # 복구 사다리. 가벼운 것부터. 센서별로 가능한 칸만 자동으로 남는다.
    #   lifecycle : 센서별 lifecycle_node 가 설정된 경우만 (rslidar_sdk 는 lifecycle 노드가 아님)
    #   service   : 센서별 unit 이 설정된 경우만
    #   power     : 센서별 power_cmd 가 설정된 경우만
    ladder: ["lifecycle", "service"]

    # 카메라 토픽 확인 후 "camera" 를 뒤에 추가한다.
    sensors: ["front_m1p", "rear_m1p", "left_bp", "right_bp", "gps"]

    # ---------------------------------------------------------------- 라이다 4대 (RoboSense M1P x2, Bpearl x2)
    # 네 대가 한 런치(lidar.service)에서 돈다고 가정한다. 와치독은 같은 유닛을 쓰는 센서를 하나의
    # 복구 단위로 묶어, 어느 한 대가 끊겨 재시작하면 나머지 세 대는 유예(GRACE)로 들어가고
    # 같은 틱에 중복으로 재시작하지 않는다.
    # 라이다마다 런치가 따로면 unit 을 lidar-front-m1p.service 처럼 나눠 적으면 된다.
    #
    # node_name: IPC 에서 라이다를 켠 뒤 `ros2 node list` 로 확인해 채운다 (예: /front_m1p/rslidar_sdk_node).
    #            채우면 "노드가 사라짐"을 발행자 수와 별개로 잡는다. 비우면 발행자 수만 본다.
    # diag_names: 드라이버가 /diagnostics 를 내면 그 status 이름 조각을 적는다. rslidar_sdk 는 안 냄 → 비움.
    front_m1p:
      topic: /front_m1p/rslidar_points
      node_name: ""
      lifecycle_node: ""
      unit: lidar.service
      # power_cmd: ["/home/USER/.local/bin/power_cycle.sh"]   # PoE 포트 제어 수단이 있을 때만. 빈 배열([])은 쓰지 말고 줄을 지운다.
      # diag_names: ["..."]         # 드라이버가 diag 를 내면 채운다. 빈 리스트 [] 는 쓰지 말고 줄을 지운다
      diag_timeout_sec: 3.0
      diag_error_level: 2          # 1: WARN 부터 고장 / 2: ERROR 부터 / 3: STALE 만

    rear_m1p:
      topic: /rear_m1p/rslidar_points
      node_name: ""
      lifecycle_node: ""
      unit: lidar.service
      # diag_names: ["..."]         # 드라이버가 diag 를 내면 채운다. 빈 리스트 [] 는 쓰지 말고 줄을 지운다
      diag_timeout_sec: 3.0
      diag_error_level: 2

    left_bp:
      topic: /left_bp/rslidar_points
      node_name: ""
      lifecycle_node: ""
      unit: lidar.service
      # diag_names: ["..."]         # 드라이버가 diag 를 내면 채운다. 빈 리스트 [] 는 쓰지 말고 줄을 지운다
      diag_timeout_sec: 3.0
      diag_error_level: 2

    right_bp:
      topic: /right_bp/rslidar_points
      node_name: ""
      lifecycle_node: ""
      unit: lidar.service
      # diag_names: ["..."]         # 드라이버가 diag 를 내면 채운다. 빈 리스트 [] 는 쓰지 말고 줄을 지운다
      diag_timeout_sec: 3.0
      diag_error_level: 2

    # ---------------------------------------------------------------- GPS (RTK)
    # /fix 는 20 Hz. 같은 드라이버가 /heading, /vel, /time_reference 도 낸다.
    # 발행자 유무는 /fix 하나로 충분하다. GPS 드라이버가 diagnostic_updater 를 쓰면
    # (ublox, septentrio 등은 보통 냄) diag_names 에 그 이름 조각을 적어 "수신 멈춤"까지 잡는다.
    #   확인: ros2 topic echo /diagnostics --field status | grep name
    gps:
      topic: /fix
      node_name: ""
      lifecycle_node: ""
      unit: rtk-gps.service
      # diag_names: ["gps"]        # 드라이버가 diag 를 내면 이름 조각을 적는다. (빈 리스트 [] 는 쓰지 말고 줄을 지운다)
      diag_timeout_sec: 3.0
      diag_error_level: 2

    # ---------------------------------------------------------------- 카메라 (Orin, 미확정)
    # bag 에 카메라 토픽이 없어 sensors 에서 빠져 있다. Orin 에서 확인한 뒤 켠다:
    #   ros2 topic list | grep -i image      → topic
    #   ros2 node list                        → node_name (Orin 이 같은 ROS_DOMAIN_ID 여야 보인다)
    camera:
      topic: /CHANGE_ME_CAMERA_TOPIC
      node_name: ""
      lifecycle_node: ""
      unit: cam.service
      # Orin 의 systemd 를 SSH 로 호출한다. "orin" 은 ~/.ssh/config 의 Host 별칭.
      # README "원격 장비를 SSH 로 재시작하기" 의 키 제한 설정을 반드시 할 것.
      systemctl_cmd: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=3", "orin", "systemctl", "--user"]
      # diag_names: ["..."]         # 드라이버가 diag 를 내면 채운다. 빈 리스트 [] 는 쓰지 말고 줄을 지운다
      diag_timeout_sec: 3.0
      diag_error_level: 2
