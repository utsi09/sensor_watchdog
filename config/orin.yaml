# Orin 쪽 설정: Orin 에 와치독을 직접 올리는 경우에만 쓴다. (IPC 에서 SSH 로 재시작하는 기본 구성에서는 불필요)
# 실행: ros2 run sensor_watchdog watchdog_node --ros-args -r __node:=watchdog_orin --params-file orin.yaml
#
# 센서 토픽은 구독하지 않는다. 발행자 유무(count_publishers), 노드 유무(node_name), 드라이버 /diagnostics 만 본다.

/**:
  ros__parameters:
    use_sim_time: false
    dry_run: true
    log_dir: "~/.local/state/sensor_watchdog"
    log_max_mb: 20.0

    # 안전 게이트: 기어가 P(22)일 때만 복구 행동을 허용한다. ipc.yaml 과 같은 토픽.
    # 테스트 중이라 꺼 둔다(""). 켜려면 /vehicle/status/gear_status (Orin 이 IPC 와 같은 ROS_DOMAIN_ID 여야 보임).
    gate_topic: ""
    gate_type: autoware_vehicle_msgs/msg/GearReport
    gate_prefix: stamp          # none | stamp | header
    gate_field_bytes: 1
    gate_ok_value: 22           # PARK
    gate_reliable: true
    gate_timeout_sec: 1.0
    gate_bypass_after_sec: -1.0

    # 센서가 하나뿐이라 공통 원인 판정은 사실상 비활성(2개 이상 필요)
    common_cause_min: 2
    common_cause_window_sec: 3.0

    action_timeout_sec: 30.0
    systemctl_cmd: ["systemctl", "--user"]

    heartbeat_host: ""
    heartbeat_port: 5006

    startup_grace_sec: 10.0
    fault_hold_sec: 2.0

    act_on_faults: ["NODE_NOT_VISIBLE", "NO_PUBLISHER", "DIAG_STALE"]
    act_on_faults_slow: ["DIAG_ERROR"]
    slow_fault_hold_sec: 5.0
    cooldown_sec: 30.0
    attempts_per_step: 2
    healthy_reset_sec: 600.0

    ladder: ["lifecycle", "service"]

    sensors: ["camera"]

    camera:
      topic: /CHANGE_ME_CAMERA_TOPIC
      node_name: ""                 # ros2 node list 로 확인해 채우면 노드 사라짐도 잡는다
      lifecycle_node: ""
      unit: cam.service
      # power_cmd: ["/home/USER/.local/bin/power_cycle.sh"]
      # diag_names: ["camera"]      # 카메라 드라이버가 /diagnostics 를 내면 그 이름 조각 (빈 리스트 [] 는 쓰지 말 것)
      diag_timeout_sec: 3.0
      diag_error_level: 2
