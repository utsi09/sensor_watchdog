# IPC 쪽 설정: lidar, gps 는 로컬 systemd 로, camera 는 SSH 로 Orin 의 systemd 를 호출해 재시작한다.
# (Orin 에 와치독을 따로 올리려면 camera 항목을 지우고 orin.yaml 을 쓴다.)
# /**: 는 노드 이름이 뭐든 적용된다는 뜻. (-r __node:=watchdog_ipc 로 띄워도 됨)
#
# CHANGE_ME 는 반드시 실제 값으로 바꿔야 한다. 확인 명령:
#   ros2 topic list -t
#   ros2 topic info /토픽 --verbose     (QoS 확인)
#   ros2 topic hz /토픽

/**:
  ros__parameters:
    use_sim_time: false

    # true: 판정과 기록만 하고 행동은 하지 않는다 (감지 전용 모드).
    # README의 "활성화 기준"을 만족하기 전까지 false로 바꾸지 않는다.
    dry_run: true

    # 원시 관측 CSV + events.csv 저장 위치. "" 면 끔.
    raw_log_dir: "~/.local/state/sensor_watchdog"

    # 안전 게이트: 이 토픽의 첫 정수 필드가 gate_ok_value 와 같을 때만 복구 행동을 허용한다.
    # 예) /ad_can/gear 의 기어 값이 P(파킹)일 때만 재시작.
    #   gate_type       : ros2 topic type /ad_can/gear
    #   gate_has_header : ros2 interface show <타입> 첫 줄이 std_msgs/Header 면 true
    #   gate_field_bytes: 헤더 다음 첫 필드 크기. bool/int8/uint8=1, int16=2, int32=4, int64=8
    #   gate_ok_value   : 허용 값 (P 에 해당하는 숫자)
    # gate_topic 을 "" 로 두면 항상 허용 (벤치 시험용). 실차에서는 반드시 설정한다.
    gate_topic: ""
    gate_type: std_msgs/msg/Bool
    gate_has_header: false
    gate_field_bytes: 1
    gate_ok_value: 1
    gate_reliable: true
    gate_timeout_sec: 1.0
    # 고장이 이 시간 이상 계속되면 게이트를 무시하고 바로 복구한다. 기본값은 fault_hold_sec 와 같아서
    # "확실히 끊긴 센서"는 기어와 무관하게 재시작된다. 기어를 기다리게 하려면 이 값을 키운다.
    # 짧은 끊김(오탐)만 게이트가 막는다. 음수면 항상 게이트를 따른다.
    gate_bypass_after_sec: 2.0

    # 이 개수 이상의 센서가 이 시간 안에 함께 죽으면 센서 탓이 아니라고 보고 행동하지 않는다.
    common_cause_min: 2
    common_cause_window_sec: 3.0

    # 한 행동(systemctl/power 스크립트/lifecycle)에 허용하는 최대 시간
    action_timeout_sec: 30.0

    # 서비스 재시작 명령 앞부분. 시스템 유닛이면 ["sudo", "-n", "systemctl"]
    systemctl_cmd: ["systemctl", "--user"]

    # 안전 MCU로 보내는 UDP 하트비트. "" 면 끔.
    heartbeat_host: ""
    heartbeat_port: 5005

    # 시작/행동 직후 판정 유예
    startup_grace_sec: 10.0
    # 고장 표시(timeout_sec 경과)가 이만큼 더 지속돼야 행동한다.
    # 라이다 기준: 1초 끊기면 고장 표시 → 2초 더 지속(총 3초 무수신) → 재시작
    fault_hold_sec: 2.0

    # 복구 행동을 하는 고장 종류. "확실히 끊긴" 경우만. 나머지(주기 저하, stamp 이상, 크기 이상)는 기록·보고만.
    act_on_faults: ["RX_TIMEOUT", "NO_PUBLISHER", "NODE_NOT_VISIBLE"]
    # 행동 완료 후 다음 행동까지 최소 간격
    cooldown_sec: 30.0
    # 같은 칸을 몇 번 시도하고 다음 칸으로
    attempts_per_step: 2
    # 이만큼 정상이면 사다리를 처음으로 되돌린다
    healthy_reset_sec: 600.0

    # 복구 사다리. 가벼운 것부터. 센서별로 가능한 칸만 자동으로 남는다.
    #   lifecycle : 센서별 lifecycle_node 가 설정된 경우만
    #   service   : 센서별 unit 이 설정된 경우만
    #   power     : 센서별 power_cmd 가 설정된 경우만
    ladder: ["lifecycle", "service", "power"]

    sensors: ["lidar", "gps", "camera"]

    lidar:
      topic: /CHANGE_ME_LIDAR_TOPIC
      type: sensor_msgs/msg/PointCloud2
      node_name: ""                 # 예: /velodyne_driver_node  ("" 면 노드 검사 생략)
      lifecycle_node: ""            # 드라이버가 lifecycle 노드일 때만
      unit: lidar.service
      # power_cmd: ["/home/USER/.local/bin/power_cycle.sh"]   # 전원 리셋 수단이 있을 때만. 빈 배열([])은 쓰지 말고 줄을 지운다.

      timeout_sec: 1.0
      stamp_timeout_sec: 1.0
      min_hz: 5.0
      hz_window_sec: 5.0
      min_bytes: 1                  # 원시 로그에서 정상 크기 분포 본 뒤 정한다
      check_stamp_progress: true
      check_stamp_age: false        # PTP 동기 후 true
      max_age_sec: 0.5
      qos:
        reliability: best_effort
        durability: volatile
        depth: 5

    gps:
      topic: /CHANGE_ME_GPS_TOPIC
      type: sensor_msgs/msg/NavSatFix
      node_name: ""
      lifecycle_node: ""
      unit: rtk-gps.service

      timeout_sec: 3.0
      stamp_timeout_sec: 3.0
      min_hz: 0.5
      hz_window_sec: 5.0
      min_bytes: 1
      check_stamp_progress: true
      check_stamp_age: false
      max_age_sec: 2.0
      qos:
        reliability: best_effort
        durability: volatile
        depth: 5

    camera:
      topic: /CHANGE_ME_CAMERA_TOPIC
      type: sensor_msgs/msg/CompressedImage     # 실제 타입으로. Image 면 그대로 바꾼다
      node_name: ""
      lifecycle_node: ""
      unit: cam.service
      # Orin 의 systemd 를 SSH 로 호출한다. "orin" 은 ~/.ssh/config 의 Host 별칭.
      # README "원격 장비를 SSH 로 재시작하기" 의 키 제한 설정을 반드시 할 것.
      systemctl_cmd: ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=3", "orin", "systemctl", "--user"]

      timeout_sec: 1.0
      stamp_timeout_sec: 1.0
      min_hz: 5.0
      hz_window_sec: 5.0
      min_bytes: 1
      check_stamp_progress: true
      check_stamp_age: false
      max_age_sec: 0.5
      qos:
        reliability: best_effort
        durability: volatile
        depth: 5
